{% extends "layout.html" %}

{% block content %}

	<h2 class="ls-title">PAdES Signature using cloud certificate with CloudHub</h2>

	<div class="ls-content">
		<form id="cpfForm" action="/pades-signature-cloudhub-rest/discover/{{ file_id }}" method="POST">
			<div class="form-group">
				<label>File to sign</label>
				<p>You are signing <a href="/download/{{ file_id }}">this document</a>.</p>
			</div>
			<div class="px-0 col col-sm-2">
				<label for="cpfField">Inform your CPF:</label>
				<input id="cpfField" class="form-control" type="text" name="cpf" placeholder="000.000.000-00" required/>
			</div>

			<button id="searchButton" type="submit" class="btn btn-primary mt-2">
				<i class="fas fa-search"></i> Search
			</button>
		</form>
	</div>

{% endblock %}

{% block scripts %}

	<script>
		$(document).ready(function () {
			// Add a mask to the CPF field.
			$('#cpfField').mask('000.000.000-00');
		});
	</script>

{% endblock %}
