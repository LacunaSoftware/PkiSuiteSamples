name: Test dotnet/console

# Runs the unit and command-line contract tests of the console app. They use an in-memory Signer
# and Pierre de Fermat's PFX, so they need no Signer API key and no certificate in the store;
# LiveSandboxTests skip themselves without a key. build-samples.yml leaves this project out,
# because it starts web apps and smoke-tests their URLs (see
# docs/adr/0002-console-project-for-agent-driven-signing.md).
on:
  pull_request:
    paths:
      - "dotnet/console/**"
      - ".github/workflows/test-console.yml"
  push:
    branches: [master]
    paths:
      - "dotnet/console/**"
      - ".github/workflows/test-console.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        # global.json here selects Microsoft.Testing.Platform, which `dotnet test --solution` needs.
        working-directory: dotnet/console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test --solution SkillFriendlySignatureApp.slnx
