plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lacunasoftware'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

// XmlDiplomaArchivalExtensionCoreSelfTestController calls RestPkiService.extendArchivalSignature(),
// which no released restpkicore-client has yet (it is only on the client's feature/extendachive
// branch, commit 93e460c). Re-enable it once restpkicore-client ships that method. The same
// exclusion is in pom.xml.
sourceSets {
    main {
        java {
            exclude '**/XmlDiplomaArchivalExtensionCoreSelfTestController.java'
        }
    }
}

// Spring Boot 4.0.8 manages versions of these with known vulnerabilities. Remove each override
// once a Spring Boot release manages a fixed version. The same overrides are in pom.xml.
ext['tomcat.version'] = '11.0.25'
ext['jackson-bom.version'] = '3.1.7'
ext['jackson-2-bom.version'] = '2.21.7'

dependencyManagement {
    dependencies {
        // cloudhub-client brings okhttp 4.10.0, which brings okio 3.0.0 (known vulnerability)
        dependency 'com.squareup.okio:okio-jvm:3.4.0'
    }
}

repositories {

    mavenCentral()

    // Uncomment to use prerelease Lacuna packages
    // maven {
    //     url "https://s01.oss.sonatype.org/content/groups/staging/"
    // }
}

dependencies {
    implementation 'com.itextpdf:itextpdf:5.5.13.3'
    implementation 'com.lacunasoftware.pkiexpress:pki-express:1.23.1'
    implementation 'com.lacunasoftware.restpki:restpki-client:1.15.11'
    implementation 'com.lacunasoftware.restpki:restpkicore-client:1.4.0'
    implementation 'com.lacunasoftware.amplia:amplia-client:1.2.1'
    implementation 'com.lacunasoftware.cloudhub:cloudhub-client:1.0.5'
    implementation 'com.lacunasoftware.signer:signer-client:2.14.0'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'commons-io:commons-io:2.14.0'
    implementation 'commons-codec:commons-codec:1.11'
    // gson is the JSON mapper of the REST controllers (see application.yml). This starter brings
    // gson and Spring Boot's gson auto-configuration.
    implementation 'org.springframework.boot:spring-boot-starter-gson'
    // Jackson 2 reads the Rest PKI Core webhook events (WebhookRestCoreController). Spring Boot 4's
    // starters bring only Jackson 3. Its version comes from Spring Boot's Jackson 2 BOM.
    implementation 'com.fasterxml.jackson.core:jackson-databind'
}
