plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lacunasoftware'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

// XmlDiplomaArchivalExtensionCoreSelfTestController calls RestPkiService.extendArchivalSignature(),
// which no released restpkicore-client has yet (it is only on the client's feature/extendachive
// branch, commit 93e460c). Re-enable it once restpkicore-client ships that method. The same
// exclusion is in pom.xml.
sourceSets {
    main {
        java {
            exclude '**/XmlDiplomaArchivalExtensionCoreSelfTestController.java'
        }
    }
}

repositories {

    mavenCentral()

    // Uncomment to use prerelease Lacuna packages
    // maven {
    //     url "https://s01.oss.sonatype.org/content/groups/staging/"
    // }
}

dependencies {
    implementation 'com.lowagie:itext:4.2.0'
    implementation 'com.lacunasoftware.pkiexpress:pki-express:1.20.0'
    implementation 'com.lacunasoftware.restpki:restpki-client:1.15.6'
    implementation 'com.lacunasoftware.restpki:restpkicore-client:1.4.0'
    implementation 'com.lacunasoftware.amplia:amplia-client:1.0.0'
    implementation 'com.lacunasoftware.cloudhub:cloudhub-client:1.0.0'
    implementation 'com.lacunasoftware.signer:signer-client:2.13.0'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'commons-io:commons-io:2.14.0'
    implementation 'commons-codec:commons-codec:1.11'
    // gson is the JSON mapper of the REST controllers (see application.yml). Its version comes from
    // Spring Boot's dependency management: Boot's gson auto-configuration needs a recent gson.
    implementation 'com.google.code.gson:gson'
}
