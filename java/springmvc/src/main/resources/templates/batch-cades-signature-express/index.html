<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page}">
<body>


<div th:fragment="content">
    <h2 class="ls-title">Batch CAdES Signature with PKI Express</h2>

    <div class="ls-content">

        <form id="batchSignForm" method="POST">
            <div class="form-group">
                <label>Files to sign</label>
                <p>
                    You'll be signing the following files:
                    <!--
                        UL element to hold the batch's documents (we'll render these programmatically,
                        see batch-signature-express-form.js).
                    -->
                <ul id="docList" />
                </p>
            </div>

            <!--
                Render a select (combo box) to list the user's certificates. For now it will be empty,
                we'll populate it later on (see batch-signature-express-form.js).
            -->
            <div class="form-group">
                <label for="certificateSelect">Choose a certificate</label>
                <select id="certificateSelect" class="custom-select"></select>
            </div>

            <!--
                Action buttons. Notice that the "Sign Batch" button is NOT a submit button. When the
                user clicks the button, we use the Web PKI component and Ajax calls to the server to
                sign each document of the batch, without submitting the form (see
                batch-signature-express-form.js).
            -->
            <div class="form-group">
                <button id="signButton" type="button" class="btn btn-primary">
                    <i class="fas fa-list"></i> Sign Batch
                </button>
                <button id="refreshButton" type="button" class="btn btn-outline-primary">
                    <i class="fas fa-retweet"></i> Refresh Certificates
                </button>
            </div>
        </form>

    </div>
</div>

<!--
	The file below contains the JS lib for accessing the Web PKI component. For more
	information, see: https://webpki.lacunasoftware.com/#/Documentation
-->
<script th:fragment="scripts" th:replace="~{fragments/web-pki :: web-pki}"></script>

<!--
	 The file below contains the necessary calls to the Web PKI component and to the server to
	 sign each document of the batch.
 -->
<script th:fragment="scripts"
        type="text/javascript"
        th:src="@{/js/batch-signature-express-form.js}"></script>

<script th:fragment="scripts" type="text/javascript" th:inline="javascript">
    /*<![CDATA[*/
    $(document).ready(function () {
        // Once the page is ready, we call the init() function on the javascript code
        // (batch-signature-express-form.js).
        batchSignatureExpressForm.init({
            certificateSelect: $('#certificateSelect'),  // The <select> element (combo box) to list the certificates.
            docList: $('#docList'),                      // The <ul> element that holds the batch's documents.
            refreshButton: $('#refreshButton'),          // The "refresh" button.
            signButton: $('#signButton'),                // The button that initiates the operation.
            documentsIds: [[${documentIds}]],             // The IDs of documents.
            ctrlEndpoint: '/api/batch-cades-signature-express'
        });
    });
    /*]]>*/
</script>
</body>
</html>
