<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Spring MVC Samples</title>
	<base href="/" />

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous" />
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.2.0/css/all.css" integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ" crossorigin="anonymous" />
	<link rel="stylesheet" href="https://cdn.lacunasoftware.com/pki-suite-samples/lacuna.9cfc0ba02542a303.css" />
	<link rel="stylesheet" th:replace="~{this :: style} ?: ~{}" />
</head>
<body>

<div class="navbar navbar-expand-lg navbar-dark bg-dark">
	<div class="container">
		<a class="navbar-brand" href="/">Spring MVC Samples</a>
	</div>
</div>

<div class="container content">
	<div id="messagesPanel"></div>
	<div th:replace="~{this :: content}"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.blockUI/2.70/jquery.blockUI.min.js" integrity="sha384-Ct2s0NBxEbvJlnXHOZJheqOGKjX3Q4ewsYoJZYnLz/teMXnlGhim5o9305EkvlsN" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js" integrity="sha384-6LwNpGeYDjlORU0Q5rfxEC8SQO6/FTh/VecUcvFvNx1gLMdX5dm8y1Y739D3lFSW" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
<script th:inline="javascript" type="text/javascript">
	/*<![CDATA[*/
	var _webPkiLicense = [[${@environment.getProperty('web-pki.license')}]];
	var _restPkiEndpoint = [[${@environment.getProperty('rest-pki.endpoint')}]];
	/*]]>*/

	// Global method to add an alert on "messagesPanel".
	function addAlert(type, message) {

		// Limit message size.
		var MESSAGE_LIMIT = 280;
		if (message.length > MESSAGE_LIMIT) {
			message = message.substring(0, MESSAGE_LIMIT);
			message += '...';
		}

		$('#messagesPanel').append(
			'<div class="alert alert-' + type + ' alert-dismissible fade show" role="alert">' +
			'<span>' + message + '</span>' +
			'    <button type="button" class="close" data-dismiss="alert" aria-label="Close">' +
			'        <span aria-hidden="true" class="fas fa-times"></span>' +
			'    </button>' +
			'</div>');
	}
</script>
<script th:replace="~{this :: scripts} ?: ~{}"></script>

</body>
</html>
